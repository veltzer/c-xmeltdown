# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

[processor.checker.ruff]
src_dirs = ["src", "scripts", "config"]


[processor.checker.pyrefly]
src_dirs = ["src", "scripts", "config"]

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".ruff.toml", ".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# The Makefile compiled src/*.c to objects and linked five X11 binaries, with
# draw.o shared across stickman/stickread/dance, all against -lX11 -lm. That
# shared-object grouping is beyond the single-file C processor, so
# scripts/build_xmeltdown.py runs the exact compile+link. (The Makefile's
# uncrustify target was a manual .PHONY format step, not part of the build.)
# It also builds wlmelt, the Wayland port of xmeltdown, generating the
# protocol glue from the XMLs in protocol/ with wayland-scanner.
[processor.explicit.generic.xmeltdown]
command = "scripts/build_xmeltdown.py"
input_globs = ["src/*.c", "protocol/*.xml"]
output_files = [
    "out/bin/grid",
    "out/bin/stickman",
    "out/bin/stickread",
    "out/bin/dance",
    "out/bin/xmeltdown",
    "out/bin/wlmelt",
]

# X11 headers/libs the demos link against, plus the Wayland client
# library, wayland-scanner, the standard protocol XMLs and libpng for
# wlmelt, so CI can build them.
[dependencies]
system = [
    "libx11-dev",
    "libwayland-dev",
    "wayland-protocols",
    "libpng-dev",
]

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The auditor persona, zizmor's strictest: everything the pedantic one
# reports (undocumented permissions, template expansion of any context,
# unnamed jobs, ...) plus the findings that need a person to judge them.
# --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=auditor"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
# warnings fail too, not only fatal errors
strict = true
src_dirs = ["protocol"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# stickman is one program made of stickman.c plus the shared drawing module
# draw.c: one run over both so draw.c's functions see their caller
[processor.checker.cppcheck.stickman]
batch = true
src_files = ["src/stickman.c", "src/draw.c"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# every other .c file is a standalone program with its own main: one run per file
[processor.checker.cppcheck.programs]
src_dirs = ["src"]
src_exclude_files = ["stickman.c", "draw.c"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# every lint suppression names a rule and says why (see the fleet's CLAUDE.md)
[processor.checker.suppressions]
src_dirs = [".github", "config", "scripts", "src"]
src_files = [".yamllint.yaml", "README.md"]
